name: Reusable Build
on:
  workflow_call:
    inputs:
      project-name: { type: string, required: true }
      service-name: { type: string, required: true }
    secrets:
      GHCR_PAT: { required: true } 
    outputs:
      image-tag:
        description: "The commit SHA used as the image tag"
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_pass
          POSTGRES_DB: users_test_db
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Create test env
        shell: bash
        run: |
          echo "DATABASE_URL=postgresql://app_user:app_pass@localhost:5433/users_test_db" >> .env.test
          echo "JWT_SECRET=test_secret_minimum_32_characters_long" >> .env.test
          echo "JWT_EXPIRES_IN=24h" >> .env.test
          echo "PORT=3001" >> .env.test
      - uses: proops2026-taskmanager/proops2026-cicd-platform/.github/actions/build-app@v2
        # ^ must be absolute — relative ./actions paths resolve against the CALLER's
        # checkout (user-service), not this platform repo. Same bug as Day 28.
      - id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      - uses: proops2026-taskmanager/proops2026-cicd-platform/.github/actions/docker-build-push@v2
        with:
          image-name: ${{ inputs.project-name }}/${{ inputs.service-name }}
          image-tag: ${{ steps.set-tag.outputs.tag }}
          push: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}