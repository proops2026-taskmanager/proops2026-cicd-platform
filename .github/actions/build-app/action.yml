name: "Build App"
description: "Set up runtime, install dependencies, scan dependencies for known CVEs, run tests, produce coverage"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "20"
  working-directory:
    description: "Where to run the build"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - name: Install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
    - name: SCA scan (dependency vulnerabilities)
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.working-directory }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
        format: table
    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm test
